# Alembic configuration for CLI usage (e.g. alembic revision --autogenerate)
# migrations.py sets these programmatically when running at app startup.

[alembic]
script_location = alembic
# sqlalchemy.url is intentionally left blank — env.py reads DATABASE_URL from the environment.
# To run migrations manually: DATABASE_URL=postgresql://... alembic upgrade head
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
