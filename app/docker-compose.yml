services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localdevpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aipresentation}
      MYSQL_USER: ${MYSQL_USER:-presenton}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-localdevpass}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:5-apache
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-localdevpass}
    ports:
      - "8080:80"
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  fastapi:
    build:
      context: ./servers/fastapi
      dockerfile: Dockerfile
    container_name: fastapi
    restart: on-failure
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "8000:8000"
    environment:
      - APP_DATA_DIRECTORY=/app_data
      - TEMP_DIRECTORY=/tmp/presenton
      - DATABASE_URL=${MYSQL_DATABASE_URL:-mysql://presenton:localdevpass@mysql:3306/aipresentation}
      - WASABI_ACCESS_KEY_ID=${WASABI_ACCESS_KEY_ID}
      - WASABI_SECRET_ACCESS_KEY=${WASABI_SECRET_ACCESS_KEY}
      - WASABI_ENDPOINT_URL=${WASABI_ENDPOINT_URL}
      - WASABI_BUCKET_DEV=${WASABI_BUCKET_DEV}
      - WASABI_BUCKET_US=${WASABI_BUCKET_US}
      - WASABI_BUCKET_EU=${WASABI_BUCKET_EU}
      - WASABI_BUCKET_AP_SE=${WASABI_BUCKET_AP_SE}
      - WASABI_BUCKET_AP_NE=${WASABI_BUCKET_AP_NE}
      - SECRET_KEY=${SECRET_KEY}
      - LLM=${LLM}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - GOOGLE_MODEL=${GOOGLE_MODEL}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - IMAGE_PROVIDER=${IMAGE_PROVIDER}
      - REDIS_URL=redis://redis:6379
      - MIGRATE_DATABASE_ON_STARTUP=true
      - CAN_CHANGE_KEYS=false
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_PRO_MONTHLY=${STRIPE_PRICE_PRO_MONTHLY}
      - STRIPE_PRICE_PRO_ANNUAL=${STRIPE_PRICE_PRO_ANNUAL}
      - STRIPE_PRICE_TEAM_MONTHLY=${STRIPE_PRICE_TEAM_MONTHLY}
      - STRIPE_PRICE_TEAM_ANNUAL=${STRIPE_PRICE_TEAM_ANNUAL}
      - SENTRY_DSN=${SENTRY_DSN_FASTAPI}
      - LLM=openai
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_PROVIDER=openai
    volumes:
      - app_data:/app_data
      - /run/user/1000/ollama/ollama.sock:/tmp/ollama.sock
      - fastapi_chroma:/app/chroma   # cache Chroma ONNX model (~79 MB) across restarts
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ./servers/fastapi
      dockerfile: Dockerfile
    container_name: worker
    restart: on-failure
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: ["python", "-m", "arq", "api.worker.WorkerSettings"]
    environment:
      - APP_DATA_DIRECTORY=/app_data
      - TEMP_DIRECTORY=/tmp/presenton
      - DATABASE_URL=${MYSQL_DATABASE_URL:-mysql://presenton:localdevpass@mysql:3306/aipresentation}
      - WASABI_ACCESS_KEY_ID=${WASABI_ACCESS_KEY_ID}
      - WASABI_SECRET_ACCESS_KEY=${WASABI_SECRET_ACCESS_KEY}
      - WASABI_ENDPOINT_URL=${WASABI_ENDPOINT_URL}
      - WASABI_BUCKET_DEV=${WASABI_BUCKET_DEV}
      - WASABI_BUCKET_US=${WASABI_BUCKET_US}
      - WASABI_BUCKET_EU=${WASABI_BUCKET_EU}
      - WASABI_BUCKET_AP_SE=${WASABI_BUCKET_AP_SE}
      - WASABI_BUCKET_AP_NE=${WASABI_BUCKET_AP_NE}
      - SECRET_KEY=${SECRET_KEY}
      - LLM=${LLM}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - GOOGLE_MODEL=${GOOGLE_MODEL}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL}
      - IMAGE_PROVIDER=${IMAGE_PROVIDER}
      - REDIS_URL=redis://redis:6379
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - SENTRY_DSN=${SENTRY_DSN_FASTAPI}
    volumes:
      - app_data:/app_data
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  nextjs:
    build:
      context: ./servers/nextjs
      dockerfile: Dockerfile
      target: dev          # uses the lightweight dev stage (no full prod build)
    container_name: nextjs
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - FASTAPI_INTERNAL_URL=http://fastapi:8000
      - SENTRY_DSN=${SENTRY_DSN_NEXTJS}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - NEXT_DIST_DIR=/tmp/next-build
      - CAN_CHANGE_KEYS=false
      - NEXT_PUBLIC_LEGAL_DOMAIN=${NEXT_PUBLIC_LEGAL_DOMAIN:-https://yourcompany.com}
      - NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
      # Puppeteer / Chromium — uses system ARM64 Chromium installed in the image
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=1
      # Directories for export temp files; /tmp is always writable
      - TEMP_DIRECTORY=/tmp/presenton
      - APP_DATA_DIRECTORY=/app_data
    volumes:
      - ./servers/nextjs:/app          # mount source for hot reload
      - nextjs_nm:/app/node_modules    # keep container's node_modules intact
      - app_data:/app_data             # shared with FastAPI for exported PPTX/PDF downloads
    networks:
      - app-network
    depends_on:
      - fastapi


volumes:
  app_data:
  redis_data:
  mysql_data:
  nextjs_nm:        # preserves node_modules installed in the dev image
  fastapi_chroma:   # caches Chroma ONNX embedding model (~79 MB) so rebuilds skip download

networks:
  app-network:
    driver: bridge
